services:
  downloader:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${YTDL_UID:-10001}:${YTDL_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${YTDL_BIND_ADDRESS:-127.0.0.1}:${YTDL_PORT:-8080}:8080"
    environment:
      YTDL_PUBLIC_URL: "${YTDL_PUBLIC_URL:-http://localhost:${YTDL_PORT:-8080}}"
      YTDL_SETUP_TOKEN: "${YTDL_SETUP_TOKEN:-}"
    volumes:
      - "${YTDL_DATA_MOUNT:-ytd-data}:/data"
      - "${YTDL_DOWNLOAD_MOUNT:-ytd-downloads}:/downloads"

volumes:
  ytd-data:
  ytd-downloads:
